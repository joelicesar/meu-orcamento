<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Meu Orçamento</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="monthnav">
      <button class="icon-btn" data-act="prev" aria-label="Mês anterior">‹</button>
      <button class="month-label" data-act="pickmonth" id="monthLabel"></button>
      <button class="icon-btn" data-act="next" aria-label="Próximo mês">›</button>
    </div>
    <button class="icon-btn" data-act="settings" aria-label="Configurações">⚙︎</button>
  </header>
  <main id="view"></main>
  <button class="fab" data-act="add" aria-label="Novo lançamento">+</button>
  <nav class="tabbar">
    <button data-tab="home"><span>🏠</span>Início</button>
    <button data-tab="tx"><span>🧾</span>Lançamentos</button>
    <button data-tab="budget"><span>🎯</span>Orçamento</button>
    <button data-tab="stats"><span>📊</span>Análises</button>
    <button data-tab="settings"><span>⚙️</span>Ajustes</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status"></div>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
